services:
  frontend:
    build: ./1_frontend/.
    container_name: frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
  backend:
    build: ./2_backend/.
    container_name: backend
    ports:
      - "1234:3000" #primero el del host
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=usuario
      - DB_PASSWORD=123456
      - DB_NAME=bd_monolito
    networks:
      - red_1
    depends_on:
      - db
  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      - POSTGRES_USER=usuario
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=bd_monolito
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    networks:
      - red_1

networks:
  red_1:
    driver: bridge

volumes:
  datos_postgres:
    driver: local

services:
  frontend:
    build: ./1_frontend/.
    container_name: frontend
    ports:
      - "4201:4201"
    depends_on:
      - backend
  backend:
    build: ./2_backend/.
    container_name: backend
    networks:
      - red_1
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=usuario
      - DB_PASSWORD=123456
      - DB_NAME=bd_monolito
    ports:
      - "1234:3000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      - POSTGRES_USER=usuario
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=bd_monolito
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    networks:
      - red_1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d bd_monolito"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  red_1:
    driver: bridge

volumes:
  datos_postgres:
    driver: local

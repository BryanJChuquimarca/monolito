<ion-app>
  <main>
    <ion-card *ngFor="let post of posts">
      <img alt="Post Image" [src]="post.image_url" />
      <ion-card-header>
        <ion-card-title>{{ post.title }}</ion-card-title>
        <ion-card-subtitle>{{ post.username }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        {{ post.content }}
      </ion-card-content>
    </ion-card>
  </main>

  <router-outlet />
</ion-app>

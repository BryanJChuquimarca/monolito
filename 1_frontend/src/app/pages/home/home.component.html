
    <main class="main-content">
      <h1 class="ion-padding-start">{{ title() }}</h1>
      <ion-card *ngFor="let post of posts">
        <div class="image-container">
          <img alt="Post Image" [src]="post.image_url" />
        </div>

        <ion-card-header>
          <ion-card-title>{{ post.username }}</ion-card-title>
          <ion-card-subtitle>{{ post.username }}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          {{ post.content }}
        </ion-card-content>
      </ion-card>
    </main>

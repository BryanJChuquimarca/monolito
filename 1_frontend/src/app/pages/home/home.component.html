<div class="centered-colum-container">
  <div *ngFor="let post of posts">
    <img [src]="post.image_url" [alt]="post.content" />
    <div class="post-actions">
    <app-likes-number [postId]="post.id"></app-likes-number>
    <button *ngIf="auth.isLoggedIn()" (click)="toggleComments(post.id)" class="action-button">
      💬
    </button>
    </div>
    <p><strong>{{post.username}}</strong>: {{post.content}}</p>
    <app-comments *ngIf="auth.isLoggedIn() && commentsVisibles[post.id]" [postId]="post.id"></app-comments>
    <button *ngIf="auth.isLoggedIn()" (click)="deletePost(post.id)">Delete Post</button>
  </div>
</div>
